<!DOCTYPE html>
<html>
<head>
    <title>Poisson Calculator</title>

    <style>

    body{
        font-family:Arial;
        background:#0F172A;
        color:white;
        text-align:center;
    }

    h1{
        color:#38BDF8;
    }

    input{
        width:250px;
        padding:10px;
        margin:10px;
        border-radius:5px;
    }

    button{
        background:#2563EB;
        color:white;
        padding:12px 20px;
        border:none;
        border-radius:5px;
        cursor:pointer;
    }
    table{
    width:60%;
    margin:30px auto;
    border-collapse:collapse;
    background:#1E293B;
}

table, th, td{
    border:2px solid #38BDF8;
}

th{
    background:#2563EB;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    text-align:center;
}

    </style>


</head>

<body>

<h1>Poisson Distribution Calculator</h1>

<input type="number" id="lambda" placeholder="Average Packet Arrival (λ)"><br><br>

<input type="number" id="x" placeholder="Observed Packets (x)"><br><br>

<input type="number" id="sent" placeholder="Packets Sent"><br><br>

<input type="number" id="received" placeholder="Packets Received"><br><br>

<button onclick="calculate()">Calculate</button>

<h2>Results</h2>

<table id="resultTable">

<tr>
<th>Parameter</th>
<th>Value</th>
</tr>

<tr>
<td>Poisson Probability</td>
<td id="probability"></td>
</tr>

<tr>
<td>Packet Loss</td>
<td id="loss"></td>
</tr>

<tr>
<td>Success Rate</td>
<td id="success"></td>
</tr>

<tr>
<td>Failure Rate</td>
<td id="failure"></td>
</tr>

</table>

<script src="script.js"></script>

</body>
</html>
